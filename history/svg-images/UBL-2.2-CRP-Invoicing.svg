<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 991.5 441.5"
   width="991.5"
   height="441.5"
   version="1.1"
   id="svg8"
   sodipodi:docname="UBL-2.2-CRP-Invoicing.svg"
   inkscape:version="1.4.3 (0d15f75, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview8"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.2274332"
     inkscape:cx="495.75"
     inkscape:cy="221.1933"
     inkscape:window-width="2056"
     inkscape:window-height="1262"
     inkscape:window-x="0"
     inkscape:window-y="39"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg8" />
  <defs
     id="defs2">
    <!-- Marker for control flow arrowheads -->
    <marker
       id="arrow"
       viewBox="0 0 12 12"
       refX="10"
       refY="6"
       markerWidth="8"
       markerHeight="8"
       orient="auto-start-reverse">
      <path
         d="m 2,2 8,4 -8,4"
         fill="none"
         stroke="#000000"
         stroke-width="1.5"
         stroke-linecap="round"
         stroke-linejoin="round"
         id="path1" />
    </marker>
    <!-- Reusable Component: Activity Node (Rounded Rectangle) -->
    <g
       id="activity-node">
      <rect
         x="0"
         y="0"
         width="230"
         height="60"
         rx="20"
         ry="20"
         fill="#ffffff"
         stroke="#000000"
         stroke-width="2"
         id="rect1" />
    </g>
    <!-- Reusable Component: Document Object Node (Rectangle) -->
    <g
       id="object-node">
      <rect
         x="0"
         y="0"
         width="150"
         height="60"
         fill="#ffffff"
         stroke="#000000"
         stroke-width="3"
         id="rect2" />
    </g>
  </defs>
  <style
     id="style2">
        .title-text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 500; fill: #000000; text-anchor: middle; }
        .node-text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #000000; text-anchor: middle; }
        .object-text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; font-style: italic; fill: #000000; text-anchor: middle; }
        .flow-line { fill: none; stroke: #000000; stroke-width: 1.5; }
    </style>
  <!-- Background Framing / Outer Border -->
  <rect
     x="0.75"
     y="0.75"
     width="990"
     height="440"
     fill="#ffffff"
     stroke="#000000"
     stroke-width="1.5"
     id="rect3" />
  <!-- Swimlane Divider (Vertical Partition Line) -->
  <line
     x1="475.75"
     y1="0.75"
     x2="475.75"
     y2="440.75"
     stroke="#000000"
     stroke-width="1.5"
     id="line3" />
  <!-- Lane Headers -->
  <text
     x="237.75"
     y="27.75"
     class="title-text"
     id="text3">Producer</text>
  <text
     x="735.75"
     y="27.75"
     class="title-text"
     id="text4">Retailer</text>
  <!-- ================= PRODUCER LANE ================= -->
  <g
     id="producer-lane"
     transform="translate(-4.25,-4.25)">
    <!-- Initial Node (Solid Black Circle) -->
    <circle
       cx="142"
       cy="85"
       r="17"
       fill="#000000"
       id="circle4" />
    <!-- Edge: Initial Node -> Raise Invoice -->
    <path
       d="m 142,102 v 93"
       class="flow-line"
       marker-end="url(#arrow)"
       id="path4" />
    <!-- Activity: Raise Invoice -->
    <use
       href="#activity-node"
       x="27"
       y="197"
       id="use4" />
    <text
       x="142"
       y="233"
       class="node-text"
       id="text5">Raise Invoice</text>
    <!-- Edge: Raise Invoice -> Document Object -->
    <path
       d="M 257,227 H 403"
       class="flow-line"
       marker-end="url(#arrow)"
       id="path5" />
  </g>
  <!-- ================= INTERMEDIATE OBJECT ================= -->
  <!-- Document Object Node: Invoice (Crosses Partition Line) -->
  <g
     id="document-node"
     transform="translate(-4.25,-4.25)">
    <use
       href="#object-node"
       x="405"
       y="197"
       id="use5" />
    <text
       x="480"
       y="233"
       class="object-text"
       id="text6">Invoice</text>
  </g>
  <!-- ================= RETAILER LANE ================= -->
  <g
     id="retailer-lane"
     transform="translate(-4.25,-4.25)">
    <!-- Edge: Document Object -> Receive Invoice -->
    <path
       d="M 555,227 H 738"
       class="flow-line"
       marker-end="url(#arrow)"
       id="path6" />
    <!-- Activity: Receive Invoice -->
    <use
       href="#activity-node"
       x="740"
       y="197"
       id="use6" />
    <text
       x="855"
       y="233"
       class="node-text"
       id="text7">Receive Invoice</text>
    <!-- Edge: Receive Invoice -> Final Node -->
    <path
       d="M 855,257 V 388"
       class="flow-line"
       marker-end="url(#arrow)"
       id="path7" />
    <!-- Activity Final Node (Bullseye Circle) -->
    <g
       id="final-node"
       transform="translate(855,405)">
      <circle
         cx="0"
         cy="0"
         r="17"
         fill="none"
         stroke="#000000"
         stroke-width="1.5"
         id="circle7" />
      <circle
         cx="0"
         cy="0"
         r="10"
         fill="#000000"
         id="circle8" />
    </g>
  </g>
</svg>
