<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 1002 452"
   width="1002"
   height="452"
   version="1.1"
   id="svg8"
   sodipodi:docname="UBL-2.2-VMI-Invoicing.svg"
   inkscape:version="1.4.3 (0d15f75, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview8"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.2145709"
     inkscape:cx="501"
     inkscape:cy="226.00575"
     inkscape:window-width="2056"
     inkscape:window-height="1262"
     inkscape:window-x="0"
     inkscape:window-y="39"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg8" />
  <defs
     id="defs2">
    <!-- Marker for standard open arrowheads -->
    <marker
       id="arrow"
       viewBox="0 0 10 10"
       refX="10"
       refY="5"
       markerWidth="8"
       markerHeight="8"
       orient="auto-start-reverse">
      <path
         d="M 0,1 10,5 0,9"
         fill="none"
         stroke="#000000"
         stroke-width="1.2"
         stroke-linecap="round"
         stroke-linejoin="round"
         id="path1" />
    </marker>
    <!-- Reusable Component: Action/Activity Node (Rounded Rectangle) -->
    <g
       id="activity-node">
      <rect
         x="0"
         y="0"
         width="230"
         height="60"
         rx="15"
         ry="15"
         fill="#ffffff"
         stroke="#000000"
         stroke-width="1.5"
         id="rect1" />
    </g>
    <!-- Reusable Component: Object/Document Node (Rectangle) -->
    <g
       id="object-node">
      <rect
         x="0"
         y="0"
         width="150"
         height="60"
         fill="#ffffff"
         stroke="#000000"
         stroke-width="2"
         id="rect2" />
    </g>
  </defs>
  <style
     id="style2">
        .title-text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #000000; text-anchor: middle; }
        .node-text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #000000; text-anchor: middle; }
        .object-text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; font-style: italic; fill: #000000; text-anchor: middle; }
        .flow-line { fill: none; stroke: #000000; stroke-width: 1.5; }
        .swimlane-border { fill: none; stroke: #000000; stroke-width: 1.5; }
    </style>
  <!-- Background Matrix / Canvas Border -->
  <rect
     x="1"
     y="1"
     width="1000"
     height="450"
     fill="#ffffff"
     stroke="#000000"
     stroke-width="2"
     id="rect3" />
  <!-- Swimlane Divider Line -->
  <line
     x1="501"
     y1="1"
     x2="501"
     y2="451"
     class="swimlane-border"
     id="line3" />
  <!-- Swimlane Titles -->
  <text
     x="251"
     y="36"
     class="title-text"
     id="text3">Producer</text>
  <text
     x="751"
     y="36"
     class="title-text"
     id="text4">Retailer</text>
  <!-- ================= PRODUCER SWIMLANE ================= -->
  <g
     id="producer-lane"
     transform="translate(1,1)">
    <!-- Initial State (Solid Black Circle) -->
    <circle
       cx="140"
       cy="90"
       r="16"
       fill="#000000"
       id="circle4" />
    <!-- Flow from Initial State to Raise Invoice -->
    <line
       x1="140"
       y1="106"
       x2="140"
       y2="198"
       class="flow-line"
       marker-end="url(#arrow)"
       id="line4" />
    <!-- 'Raise Invoice' Activity Node -->
    <use
       href="#activity-node"
       x="25"
       y="200"
       id="use4" />
    <text
       x="140"
       y="236"
       class="node-text"
       id="text5">Raise Invoice</text>
    <!-- Flow from Raise Invoice to Invoice Object -->
    <line
       x1="255"
       y1="230"
       x2="402"
       y2="230"
       class="flow-line"
       marker-end="url(#arrow)"
       id="line5" />
  </g>
  <!-- ================= OBJECT / DOCUMENT ================= -->
  <!-- 'Invoice' Object Node (Centered across the divider grid boundary) -->
  <g
     id="document-node"
     transform="translate(1,1)">
    <use
       href="#object-node"
       x="405"
       y="200"
       id="use5" />
    <text
       x="480"
       y="235"
       class="object-text"
       id="text6">Invoice</text>
  </g>
  <!-- ================= RETAILER SWIMLANE ================= -->
  <g
     id="retailer-lane"
     transform="translate(1,1)">
    <!-- Flow from Invoice Object to Receive Invoice -->
    <line
       x1="555"
       y1="230"
       x2="737"
       y2="230"
       class="flow-line"
       marker-end="url(#arrow)"
       id="line6" />
    <!-- 'Receive Invoice' Activity Node -->
    <use
       href="#activity-node"
       x="740"
       y="200"
       id="use6" />
    <text
       x="855"
       y="236"
       class="node-text"
       id="text7">Receive Invoice</text>
    <!-- Flow from Receive Invoice to Final State -->
    <line
       x1="855"
       y1="260"
       x2="855"
       y2="392"
       class="flow-line"
       marker-end="url(#arrow)"
       id="line7" />
    <!-- Final State (Bullseye / Encased Circle) -->
    <circle
       cx="855"
       cy="410"
       r="16"
       fill="none"
       stroke="#000000"
       stroke-width="1.5"
       id="circle7" />
    <circle
       cx="855"
       cy="410"
       r="9"
       fill="#000000"
       id="circle8" />
  </g>
</svg>
