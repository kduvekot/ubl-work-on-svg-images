<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 1000 350"
   width="1000"
   height="350"
   version="1.1"
   id="svg8"
   sodipodi:docname="UBL-2.2-IMFM-GenericIntermodalFreightProcess.svg"
   inkscape:version="1.4.3 (0d15f75, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview8"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="0.074285714"
     inkscape:cx="504.80769"
     inkscape:cy="168.26923"
     inkscape:window-width="2056"
     inkscape:window-height="1262"
     inkscape:window-x="0"
     inkscape:window-y="39"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg8" />
  <defs
     id="defs1">
    <!-- Reusable chevron chevron path blueprint -->
    <!-- Start top-left, horizontal across, point right, horizontal back, point left indent -->
    <path
       id="chevron-shape"
       d="m 0,20 h 270 l 40,85 -40,85 H 0 l 40,-85 z" />
    <style
       id="style1">
            .background-canvas { fill: #ffffff; }
            .outer-border { fill: none; stroke: #000000; stroke-width: 2px; }
            .chevron-node { fill: #ffffff; stroke: #000000; stroke-width: 2px; stroke-linejoin: round; }
            .header-text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 32px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .body-text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 21px; font-weight: normal; fill: #000000; line-height: 1.4; }
        </style>
  </defs>
  <!-- Canvas Background -->
  <rect
     class="background-canvas"
     width="1000"
     height="350"
     id="rect1"
     x="0"
     y="0" />
  <!-- Outer Frame Box -->
  <rect
     class="outer-border"
     x="15"
     y="15"
     width="970"
     height="320"
     id="rect2" />
  <!-- PHASE 1: PLAN -->
  <g
     id="phase-plan">
    <use
       href="#chevron-shape"
       x="25"
       y="15"
       class="chevron-node"
       id="use2" />
    <text
       x="180"
       y="115"
       class="header-text"
       id="text2">Plan</text>
    <text
       x="25"
       y="240"
       class="body-text"
       id="text3"><tspan
         x="25"
         dy="0"
         id="tspan2">Select transport chain</tspan><tspan
         x="25"
         dy="30"
         id="tspan3">Organize transport</tspan></text>
  </g>
  <!-- PHASE 2: EXECUTE -->
  <g
     id="phase-execute">
    <!-- Shift horizontally along x axis to interlock seamlessly -->
    <use
       href="#chevron-shape"
       x="330"
       y="15"
       class="chevron-node"
       id="use3" />
    <text
       x="485"
       y="115"
       class="header-text"
       id="text4">Execute</text>
    <text
       x="330"
       y="240"
       class="body-text"
       id="text5"><tspan
         x="330"
         dy="0"
         id="tspan4">Issue transport instructions</tspan><tspan
         x="330"
         dy="30"
         id="tspan5">Monitor (detect deviations)</tspan></text>
  </g>
  <!-- PHASE 3: COMPLETE -->
  <g
     id="phase-complete">
    <use
       href="#chevron-shape"
       x="640"
       y="15"
       class="chevron-node"
       id="use5" />
    <text
       x="795"
       y="115"
       class="header-text"
       id="text6">Complete</text>
    <text
       x="640"
       y="240"
       class="body-text"
       id="text8"><tspan
         x="640"
         dy="0"
         id="tspan6">Issue proof of delivery</tspan><tspan
         x="640"
         dy="30"
         id="tspan7">Handle invoices and payments</tspan><tspan
         x="640"
         dy="30"
         id="tspan8">Handle claims</tspan></text>
  </g>
</svg>
